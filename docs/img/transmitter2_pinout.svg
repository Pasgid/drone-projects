<circle cx="669.0" cy="364" r="7" fill="#d11f1f" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="368.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">5V</text>
<line x1="669.0" y1="364" x2="731.0" y2="364" stroke="#d11f1f" stroke-width="4"/>
<rect x="739.0" y="352" width="330" height="24" rx="5" fill="#d11f1f" opacity="1"/>
<text x="747.0" y="369.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">5 V in</text>
<text x="24.0" y="448.0" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Notes</text>
<text x="24.0" y="468.0" font-size="13" fill="#333" text-anchor="start">- 3-position ON-OFF-ON switch: middle leg to GND, outer legs to G20 and G8, no resistors.</text>
<text x="24.0" y="488.0" font-size="13" fill="#333" text-anchor="start">- Not G10: on the C3 Zero it is the RGB LED data line.</text>
<text x="24.0" y="508.0" font-size="13" fill="#333" text-anchor="start">- Battery divider: batt+ R1 G2 R2 GND, 100 nF from G2 to GND.</text>
</svg>