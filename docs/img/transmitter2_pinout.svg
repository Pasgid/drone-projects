<text x="747.0" y="301.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">GND: switch middle leg, pots, OLED</text>
<circle cx="669.0" cy="330" r="7" fill="#d11f1f" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="334.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">3V3</text>
<line x1="669.0" y1="330" x2="731.0" y2="330" stroke="#d11f1f" stroke-width="4"/>
<rect x="739.0" y="318" width="330" height="24" rx="5" fill="#d11f1f" opacity="1"/>
