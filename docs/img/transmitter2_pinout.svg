<text x="99.0" y="86.0" font-size="12" fill="#333" text-anchor="start">motor / output</text>
<rect x="211" y="74" width="14" height="14" rx="3" fill="#16a34a"/>
<text x="231.0" y="86.0" font-size="12" fill="#333" text-anchor="start">analog in</text>
