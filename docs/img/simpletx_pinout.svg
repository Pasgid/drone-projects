<text x="747.0" y="369.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">THROTTLE pot wiper (left stick up/down)</text>
<circle cx="669.0" cy="398" r="7" fill="#16a34a" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="402.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">G0</text>
<line x1="669.0" y1="398" x2="731.0" y2="398" stroke="#16a34a" stroke-width="4"/>
<rect x="739.0" y="386" width="330" height="24" rx="5" fill="#16a34a" opacity="1"/>
<text x="747.0" y="403.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">YAW pot wiper (left stick left/right)</text>
<text x="24.0" y="482.0" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Notes</text>
<text x="24.0" y="502.0" font-size="13" fill="#333" text-anchor="start">- Each pot: one end to 3V3, other end to GND, wiper to its pin. Pots must be on G0-G4 (ADC1 works with the radio on).</text>
<text x="24.0" y="522.0" font-size="13" fill="#333" text-anchor="start">- Buttons need no resistor (internal pull-up). Battery divider: 100 nF from G2 to GND.</text>
<text x="24.0" y="542.0" font-size="13" fill="#333" text-anchor="start">- Sim mode (menu): restarts once as a BLE gamepad for PC simulators.</text>
</svg>