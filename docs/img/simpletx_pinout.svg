<rect x="739.0" y="318" width="330" height="24" rx="5" fill="#16a34a" opacity="1"/>
<text x="747.0" y="335.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">TX battery: batt+ 100k / 100k GND (ratio 2)</text>
<circle cx="669.0" cy="364" r="7" fill="#16a34a" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="368.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">G1</text>
<line x1="669.0" y1="364" x2="731.0" y2="364" stroke="#16a34a" stroke-width="4"/>
