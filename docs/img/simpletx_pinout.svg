<text x="747.0" y="165.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">5 V in (USB or 1S boost)</text>
<circle cx="669.0" cy="194" r="7" fill="#222222" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="198.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">GND</text>
