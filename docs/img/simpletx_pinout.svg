<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="622" viewBox="0 0 1180 622" font-family="Segoe UI, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24.0" y="36.0" font-size="22" fill="#111" text-anchor="start" font-weight="bold">SimpleTX - two-button ESP-NOW transmitter</text>
<text x="24.0" y="60.0" font-size="13" fill="#555" text-anchor="start">ESP32-C3 SuperMini, USB-C at the top, pin order as on the shield PCBs. Check the labels printed on your board.</text>
