<text x="747.0" y="199.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">GND: pot ends, buttons, OLED</text>
<circle cx="669.0" cy="228" r="7" fill="#d11f1f" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="232.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">3V3</text>
<line x1="669.0" y1="228" x2="731.0" y2="228" stroke="#d11f1f" stroke-width="4"/>
<rect x="739.0" y="216" width="330" height="24" rx="5" fill="#d11f1f" opacity="1"/>
<text x="747.0" y="233.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">3.3 V: pot ends, OLED VCC</text>
<circle cx="669.0" cy="262" r="7" fill="#16a34a" stroke="#d9b24a" stroke-width="2.5"/>
