<circle cx="669.0" cy="398" r="7" fill="#d11f1f" stroke="#d9b24a" stroke-width="2.5"/>
<text x="655.0" y="402.0" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">3V3</text>
<line x1="669.0" y1="398" x2="731.0" y2="398" stroke="#d11f1f" stroke-width="4"/>
<rect x="739.0" y="386" width="330" height="24" rx="5" fill="#d11f1f" opacity="1"/>
<text x="747.0" y="403.0" font-size="13" fill="#fff" text-anchor="start" font-weight="bold">3.3 V to sensors</text>
<text x="24.0" y="482.0" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Notes</text>
<text x="24.0" y="502.0" font-size="13" fill="#333" text-anchor="start">- GPS u-blox (UBX) 1k resistor in the TX wire: the boot ROM drives G21 for a moment at power-up.</text>
<text x="24.0" y="522.0" font-size="13" fill="#333" text-anchor="start">- Compass QMC5883L (0x0D) or HMC5883L (0x1E) on the I2C bus. VL53L1X faces down (alt hold).</text>
<text x="24.0" y="542.0" font-size="13" fill="#333" text-anchor="start">- Motor 4 is on G8 on this board (G4 is the battery divider).</text>
</svg>