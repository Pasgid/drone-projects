<text x="24.0" y="448.0" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Notes</text>
<text x="24.0" y="468.0" font-size="13" fill="#333" text-anchor="start">- PPM from a 5 V receiver needs a divider: 10k series, 20k to GND. Or use the ESP-NOW link (no receiver).</text>
<text x="24.0" y="488.0" font-size="13" fill="#333" text-anchor="start">- Do not use IO6-IO11 (flash), IO12 / IO15 (strapping), IO2 (strapping + LED).</text>
<text x="24.0" y="508.0" font-size="13" fill="#333" text-anchor="start">- Battery divider: 100 nF from IO34 to GND.</text>
